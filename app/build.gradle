plugins {
    id 'com.android.application'
    id 'com.google.dagger.hilt.android'
}

// Development API URL. Override per machine with -PsportmateApiBaseUrl=... or in ~/.gradle/gradle.properties
// (never commit a personal address). Retrofit requires the trailing slash.
def apiBaseUrl = providers.gradleProperty('sportmateApiBaseUrl').getOrElse('http://localhost:5000/').trim()
if (!apiBaseUrl.endsWith('/')) {
    apiBaseUrl += '/'
}

android {
    namespace = 'com.sportmate.app'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.sportmate.app'
        minSdk = 23
        targetSdk = 36
        versionCode = 1
        versionName = '1.0'
        buildConfigField 'String', 'API_BASE_URL', '"' + apiBaseUrl.replace('\\', '\\\\').replace('"', '\\"') + '"'
        manifestPlaceholders = [usesCleartextTraffic: 'true']
    }

    buildTypes {
        debug {
            applicationIdSuffix = '.debug'
        }
        release {
            manifestPlaceholders = [usesCleartextTraffic: 'false']
            buildConfigField 'String', 'API_BASE_URL', '"https://api.example.invalid/"'
            minifyEnabled = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.9.4'
    implementation 'androidx.navigation:navigation-fragment:2.9.5'
    implementation 'androidx.navigation:navigation-ui:2.9.5'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    implementation 'com.google.dagger:hilt-android:2.57.2'
    annotationProcessor 'com.google.dagger:hilt-compiler:2.57.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}